<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Looki 日程 · 三版原型</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{
  font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  color:#222a26;background:#eef1ef;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
h1,h2,h3,h4{margin:0;font-weight:600}
p{margin:0}
muted,.muted{color:var(--muted)}

/* ---------- 原型版本切换条 ---------- */
#protoBar{
  position:fixed;right:16px;bottom:16px;z-index:900;display:flex;align-items:center;gap:6px;
  padding:8px 10px;border-radius:14px;background:rgba(20,28,24,.93);color:#fff;
  box-shadow:0 12px 32px rgba(0,0,0,.28);font-size:12px;backdrop-filter:blur(8px);
}
#protoBar .pb-label{color:#a9b8b0;padding:0 4px}
#protoBar .pb-note{color:#7f8f87;padding:0 6px;border-left:1px solid rgba(255,255,255,.16)}
#protoBar button{border:none;background:rgba(255,255,255,.1);color:#e8f0ec;padding:6px 11px;border-radius:8px;font-size:12px}
#protoBar button:hover{background:rgba(255,255,255,.2)}
#protoBar button.on{background:#fff;color:#152019;font-weight:600}

/* ---------- 通用 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h2,.card-h h3{font-size:15px}
.card-h .muted{margin-left:auto;font-size:12px}
.btn-primary{background:var(--accent);border:1px solid var(--accent);color:#fff;padding:7px 14px;border-radius:8px;font-size:13px}
.btn-primary:hover{filter:brightness(.94)}
.mini{border:1px solid var(--line);background:var(--card);color:var(--muted);padding:4px 9px;border-radius:7px;font-size:12px;line-height:1.3}
.mini:hover{background:var(--accent-soft);color:var(--accent)}
.mini.wide{width:100%;margin-top:10px;padding:7px}
.mini.danger{color:#b4451f;border-color:#ecc9bd}
.mini.danger:hover{background:#fdeee9;color:#b4451f}
.badge{font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:10px}
.tag::before{content:"";width:4px;height:4px;border-radius:50%;background:#a9b6b0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips i{font-style:normal;font-size:11.5px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 9px}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:13px}
.task-empty{font-size:12.5px;color:var(--muted);padding:8px 6px}

/* Markdown 正文 */
.md{font-size:13px;line-height:1.75;color:var(--md-text);overflow-wrap:anywhere;margin-top:4px}
.md h1,.md h2,.md h3,.md h4{margin:8px 0 4px;color:var(--text)}
.md h1{font-size:13px;font-weight:600;letter-spacing:0}
.md h2{font-size:13px;font-weight:600}
.md h3,.md h4{font-size:12.5px;font-weight:600;color:var(--muted)}
.md p{margin:0 0 8px}
.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 8px;padding-left:20px}
.md li{margin:2px 0}
.md blockquote{margin:0 0 8px;padding:6px 10px;border-left:3px solid #d8c48d;background:rgba(253,247,231,.75);border-radius:0 8px 8px 0;color:#6b5716}
.md code{background:rgba(23,107,86,.08);border-radius:4px;padding:1px 4px;font-size:11.5px}
.md pre{margin:0 0 8px;background:rgba(23,107,86,.07);border-radius:8px;padding:8px 10px;overflow-x:auto}
.md a{color:var(--accent);text-decoration:underline}

/* 任务行 */
.task-rows{display:grid;gap:1px}
.task-row{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:8px;font-size:13px;transition:background .12s}
.task-row:hover{background:var(--accent-soft)}
.task-row input[type=checkbox]{margin:3px 0 0;width:15px;height:15px;accent-color:var(--accent);flex:none}
.task-body{flex:1;min-width:0;border:none;background:none;text-align:left;padding:0;line-height:1.55;color:var(--text);font-size:13px}
.task-body:hover{color:var(--accent)}
.task-row.is-done .task-body{color:var(--muted);text-decoration:line-through}
.task-row.is-deleted{opacity:.72}
.task-row.is-deleted .task-body{color:#9aa6a0;text-decoration:line-through}
.task-del{flex:none;border:none;background:none;color:var(--muted);width:22px;height:22px;border-radius:6px;line-height:1;font-size:16px;cursor:pointer}
.task-del:hover{background:#f6e3dc;color:#b4451f}
.task-row.is-deleted .task-del:hover{background:var(--accent-soft);color:var(--accent)}
.task-date{flex:none;font-size:11px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.task-src{flex:none;font-size:10.5px;color:var(--muted);background:var(--accent-soft);border-radius:999px;padding:1px 6px;margin-top:2px}

/* 音频 / 日志 / 纠正 */
.audio{margin-top:10px;padding:9px 11px;border-left:3px solid var(--clue-line);background:var(--clue);border-radius:0 8px 8px 0}
.audio-tag{font-size:11px;font-weight:600;color:var(--clue-text);margin-bottom:4px}
.audio .md{color:var(--clue-text)}
.journal{position:relative;margin-top:10px;padding:9px 11px;border:1px solid #d7e1ec;border-left:3px solid #7ba0c9;border-radius:0 8px 8px 0;background:#f5f9fd}
.journal-tag{font-size:11px;font-weight:600;color:#35597f}
.journal-time{display:block;font-size:11px;color:#6b7f93;margin:2px 0 4px}
.journal .mini-edit{position:absolute;right:8px;top:8px}
.corrections{margin-top:10px;padding:9px 11px;border:1px solid #c9ddd4;border-radius:9px;background:var(--accent-soft)}
.corr-head{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:var(--accent);margin-bottom:4px}
.corr-head .mini{margin-left:auto;padding:2px 7px;font-size:11px}
.corr-item{padding:6px 0;border-top:1px solid rgba(120,160,140,.22)}
.corr-item:first-of-type{border-top:none}
.corr-item p{font-size:12.5px;line-height:1.7;color:var(--text)}
.corr-item time{display:block;margin-top:3px;font-size:11px;color:var(--muted)}
.corr-item .corr-ops{display:flex;gap:2px;margin-left:auto}
.corr-item-top{display:flex;gap:8px;align-items:flex-start}

/* 时间轴卡片 */
.timeline{display:grid;gap:10px}
.item{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.item:hover{border-color:var(--hover-line)}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.item-time{font-size:12px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;padding-top:1px}
.item-time span{display:block;color:var(--muted);font-weight:400}
.item-body{min-width:0}
.item-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:14px}
.item-actions{margin-left:auto;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.item:hover .item-actions,.item.sel .item-actions{opacity:1}

/* 日期头 */
.day-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.day-head h2{font-size:16px}
.day-head .muted{font-size:12px;margin-top:2px}
.day-acts{margin-left:auto;display:flex;gap:6px;align-items:center}

/* 日历 */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head h3{font-size:14px}
.cal-head .head-acts{margin-left:auto;display:flex;gap:4px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-grid .dow{font-size:11px;color:var(--muted);text-align:center;padding:2px 0 4px}
.cell{position:relative;min-height:36px;border:1px solid transparent;border-radius:8px;background:none;padding:3px 0 8px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums}
.cell:hover{background:var(--accent-soft)}
.cell.out{color:#c2ccc7}
.cell.sel{border-color:var(--accent);background:var(--accent-soft)}
.cell.today .num{background:var(--accent);color:#fff;border-radius:50%}
.cell .num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px}
.dots{position:absolute;left:0;right:0;bottom:3px;display:flex;gap:2px;justify-content:center}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--dot)}
.legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend i{width:5px;height:5px;border-radius:50%;background:var(--dot)}

/* 目录 */
.outline{display:grid;gap:1px;max-height:240px;overflow:auto}
.out-row{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:baseline;border:none;background:none;padding:7px 8px;border-radius:8px;text-align:left}
.out-row:hover{background:var(--accent-soft)}
.out-row.cur{background:var(--accent-soft)}
.out-time{font-size:12px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.out-title{font-size:13px;line-height:1.45;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.out-row.cur .out-title{font-weight:600;color:var(--accent)}

/* 聚合 */
.agg-card{max-width:900px;margin:20px auto}
.group-h{font-size:13px;color:var(--muted);margin:18px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.group-h:first-of-type{border-top:none;padding-top:0;margin-top:6px}

/* 设置 */
.settings-card{max-width:920px;margin:20px auto}
.set-section{padding:16px 0;border-top:1px solid var(--line)}
.set-section:first-of-type{border-top:none;padding-top:0}
.set-section>h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.set-section>h3 small{font-weight:400;color:var(--muted);font-size:11.5px}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.set-grid label{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
.set-grid label.full{grid-column:1/-1}
.set-grid input,.set-grid select,.set-grid textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
.set-grid input:focus,.set-grid select:focus,.set-grid textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.set-grid small{font-size:11.5px;color:var(--muted);line-height:1.5}
.inline-hint{color:var(--muted);font-weight:400}
.keyrow{display:flex;gap:6px}
.keyrow input{flex:1}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text);cursor:pointer;padding:6px 0}
.check input{width:auto;margin-top:3px;flex:none}
.check small{display:block;color:var(--muted);font-size:11.5px;line-height:1.6}
.img-mode{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0;display:grid;gap:8px}
.img-mode legend{font-size:12px;color:var(--muted);padding:0 6px}
.radio{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text)}
.radio input{width:auto}
.img-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:10px 12px;border-radius:8px;background:var(--accent-soft)}
.img-fields label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.img-fields label.full{grid-column:1/-1}
.set-foot{display:flex;justify-content:flex-end;gap:8px;padding-top:18px;border-top:1px solid var(--line);margin-top:6px}

/* 边缘收起按钮 */
.edge{position:fixed;top:50%;transform:translateY(-50%);z-index:80;width:24px;height:54px;border:1px solid var(--line);background:var(--card);color:var(--muted);box-shadow:0 4px 14px rgba(20,40,32,.12);font-size:17px;line-height:1;padding:0;transition:left .2s,right .2s,background .15s}
.edge:hover{background:var(--accent-soft);color:var(--accent)}
.edge-left{left:0;border-radius:0 10px 10px 0;border-left:none}
.edge-right{right:0;border-radius:10px 0 0 10px;border-right:none}
@media(max-width:960px){
  .edge{width:30px;height:64px;font-size:19px}
}

/* 顶栏滚动隐藏 */
.topbar,.page-head,.cbar{transition:transform .25s ease}
.topbar.hide,.page-head.hide,.cbar.hide{transform:translateY(-110%)}

/* Toast */
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(12px);z-index:1000;background:#1b2620;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============================================================
   A 版：现有布局改进
   ============================================================ */
#stage.vA{
  --app-bg:#f4f7f5;--card:#fff;--line:#e2e9e5;--text:#222a26;--muted:#65716b;
  --accent:#176b56;--accent-soft:#e9f2ee;--dot:#e0a908;--hover-line:#c3d6cd;
  --clue:#fdf7e7;--clue-line:#ecd9a4;--clue-text:#7d6218;--md-text:#46504b;
  --radius:12px;--shadow:0 1px 2px rgba(20,40,32,.04);
  background:var(--app-bg);min-height:100vh;color:var(--text);
}
#stage.vA .topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 22px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#stage.vA .brand{display:flex;align-items:center;gap:10px;min-width:0}
#stage.vA .logo{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
#stage.vA .brand h1{font-size:16px;white-space:nowrap}
#stage.vA .status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
#stage.vA .tabs{display:flex;gap:2px;padding:3px;background:#eef2f0;border-radius:10px}
#stage.vA .tab{border:none;background:none;padding:6px 16px;border-radius:8px;font-size:13px;color:var(--muted)}
#stage.vA .tab.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.07)}
#stage.vA .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
#stage.vA .layout{display:grid;grid-template-columns:268px minmax(0,1fr) 350px;gap:16px;align-items:start;padding:16px 22px 36px;max-width:1500px;margin:0 auto}
#stage.vA.hide-left .layout{grid-template-columns:minmax(0,1fr) 350px}
#stage.vA.hide-left .task-panel{display:none}
#stage.vA.hide-right .layout{grid-template-columns:268px minmax(0,1fr)}
#stage.vA.hide-right .side{display:none}
#stage.vA.hide-left.hide-right .layout{grid-template-columns:minmax(0,1fr)}
#stage.vA .task-panel{position:sticky;top:66px;max-height:calc(100vh - 82px);display:flex;flex-direction:column;gap:10px}
#stage.vA .panel-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
#stage.vA .panel-head h2{font-size:15px}
#stage.vA .panel-head .muted{margin-left:auto;font-size:11.5px}
#stage.vA .side{display:flex;flex-direction:column;gap:16px;position:sticky;top:66px;max-height:calc(100vh - 82px);overflow-y:auto}
#stage.vA .center{min-width:0}
#stage.vA .a-settings{max-width:920px;margin:20px auto}
@media(max-width:960px){
  #stage.vA .layout,#stage.vA .layout.hide-left,#stage.vA .layout.hide-right,#stage.vA .layout.hide-left.hide-right,
  #stage.vA.hide-left .layout,#stage.vA.hide-right .layout,#stage.vA.hide-left.hide-right .layout{grid-template-columns:1fr}
  #stage.vA .task-panel,#stage.vA .side{position:static;max-height:none}
  #stage.vA.hide-left .task-panel{display:none}
  #stage.vA.hide-right .side{display:none}
}

/* A 版莱茵生命主题：保留原版三栏和月份日历 */
#stage.vA{
  --app-bg:#e7eae4;--card:#f7f8f4;--line:#c6ccc1;--text:#20251f;--muted:#687064;
  --accent:#252b24;--accent-soft:#edf3df;--dot:#252b24;--hover-line:#899482;
  --clue:#f1f3e9;--clue-line:#c6ccc1;--clue-text:#4b5546;--md-text:#465043;
  --radius:0px;--shadow:none;--rhine:#d6f65a;
}
#stage.vA .topbar{background:#f5f6f2;border-bottom:1px solid #252b24;padding:10px 20px;backdrop-filter:none}
#stage.vA .logo{width:36px;height:36px;border-radius:0;background:#252b24;color:var(--rhine);font:700 13px/1 Consolas,monospace;clip-path:polygon(0 0,75% 0,100% 25%,100% 100%,0 100%)}
#stage.vA .brand-copy{display:grid;gap:2px}
#stage.vA .brand-copy strong{font-size:12px;letter-spacing:.16em;line-height:1}
#stage.vA .brand-copy h1{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:.04em}
#stage.vA .tabs{background:#e2e6de;border:1px solid #c6ccc1;border-radius:0;padding:2px}
#stage.vA .tab{border-radius:0;padding:6px 16px}
#stage.vA .tab.active{background:#252b24;color:var(--rhine);box-shadow:none}
#stage.vA .btn-primary{border-radius:0;background:#252b24;border-color:#252b24;color:var(--rhine)}
#stage.vA .mini,#stage.vA .edge{border-radius:0}
#stage.vA .mini:hover{background:var(--rhine);color:#20251f}
#stage.vA .card{position:relative;background:#f7f8f4;border-color:#bfc6ba}
#stage.vA .card:after{content:"";position:absolute;right:-1px;top:-1px;width:12px;height:12px;background:linear-gradient(45deg,transparent 47%,#bfc6ba 48% 53%,#e7eae4 54%);pointer-events:none}
#stage.vA .card-h,#stage.vA .panel-head{border-bottom:1px solid #d2d7cd;padding-bottom:9px}
#stage.vA .card-h h2,#stage.vA .card-h h3,#stage.vA .panel-head h2{font-size:13px;letter-spacing:.04em}
#stage.vA .card-h h2:before,#stage.vA .panel-head h2:before{content:"";display:inline-block;width:5px;height:11px;margin-right:7px;background:var(--rhine);border:1px solid #252b24;vertical-align:-1px}
#stage.vA .item{border-radius:0;background:#f7f8f4}
#stage.vA .item.sel{border-color:#252b24;box-shadow:inset 4px 0 var(--rhine)}
#stage.vA .task-row{border-radius:0;border-bottom:1px solid #e0e4dc}
#stage.vA .task-row:hover{background:#edf2df}
#stage.vA .task-del{border-radius:0}
#stage.vA .task-del:hover{background:var(--rhine);color:#20251f}
#stage.vA .journal{border:0;border-left:3px solid #252b24;border-radius:0;background:#edf0e8}
#stage.vA .journal-tag{display:inline-block;padding:2px 7px;background:#252b24;color:var(--rhine);font-size:10px;letter-spacing:.06em}
#stage.vA .journal-time{color:#687064}
#stage.vA .corrections{border:0;border-left:3px solid var(--rhine);border-radius:0;background:#f1f4e9}
#stage.vA .corr-head{color:#394137}
#stage.vA .corr-item p{font-size:12.5px;line-height:1.8;color:#394137}
#stage.vA .cell{border-radius:0;min-height:40px;border-color:transparent}
#stage.vA .cell:hover{background:#edf2df}
#stage.vA .cell.sel{border-color:#252b24;background:var(--rhine)}
#stage.vA .cell.today .num{border-radius:0;background:#252b24;color:var(--rhine)}
#stage.vA .cell.sel .num{background:transparent;color:#20251f}
#stage.vA .legend i{border-radius:0;background:var(--rhine);border:1px solid #252b24}
#stage.vA .set-grid input,#stage.vA .set-grid select,#stage.vA .set-grid textarea,#stage.vA .img-mode,#stage.vA .img-fields{border-radius:0}
#stage.vA .set-grid input:focus,#stage.vA .set-grid select:focus,#stage.vA .set-grid textarea:focus{outline:2px solid var(--rhine);border-color:#252b24}
#stage.vA .chips i{border-radius:0;background:#e8eddf;color:#394137}

/* ============================================================
   B 版：LivingMemory 风格
   ============================================================ */
#stage.vB{
  --app-bg:#f8f9fa;--card:#ffffff;--line:#e9ecef;--text:#212529;--muted:#6c757d;
  --accent:#4c6ef5;--accent-soft:#edf2ff;--dot:#f59f00;--hover-line:#b7c4f7;
  --clue:#fff9db;--clue-line:#ffe08a;--clue-text:#856404;--md-text:#495057;

    { id: 't6', body: '倒垃圾', done: true, deleted: false, day: '2026-11-21', journalId: 'j1', source: 'journal' },

/* ============================================================
   基础工具
   ============================================================ */
const stage = document.getElementById('stage');
const dlgItem = document.getElementById('dlgItem');
const dlgJournal = document.getElementById('dlgJournal');
const dlgTask = document.getElementById('dlgTask');
const dlgCorrection = document.getElementById('dlgCorrection');
const toastEl = document.getElementById('toast');
let toastTimer = null;

const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = s => new Date(`${s}T00:00:00`);
const hhmm = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const weekday = s => WEEK[parseDay(s).getDay()];
const todayStr = () => MOCK_TODAY;

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

/* Markdown 渲染：先去掉任务行（任务由任务列表单独展示），再解析并消毒 */
function md(text) {
  const raw = String(text || '').split('\n').filter(line => !TASK_RE.test(line)).join('\n').trim();
  if (!raw) return '';
  if (!window.marked || !window.DOMPurify) return `<p>${esc(raw)}</p>`;
  const html = window.marked.parse(raw, { gfm: true, breaks: true });
  return window.DOMPurify.sanitize(html, {
    USE_PROFILES: { html: true },
    FORBID_TAGS: ['img', 'iframe', 'form', 'input', 'button', 'style', 'svg', 'video', 'audio'],
    FORBID_ATTR: ['style'],
  });
}

/* ============================================================
   任务逻辑
   ============================================================ */
const findTask = id => state.tasks.find(t => t.id === id);
const tasksForDay = day => state.tasks.filter(t => t.day === day);
const tasksForItem = item => state.tasks.filter(t => t.itemId === item.id || (item.journal && t.journalId === item.journal.id));
const itemsForDay = day => state.items.filter(i => i.date === day).sort((a, b) => a.start_at.localeCompare(b.start_at));

function sortTasks(list) {
  const rank = t => (t.deleted ? 2 : t.done ? 1 : 0);
  return [...list].sort((a, b) => rank(a) - rank(b));
}

function visibleTasks(list, ctx) {
  if (ctx === 'panel') return list.filter(t => !t.done && !t.deleted);
  if (ctx === 'aggregate') return state.settings.hideDeletedAggregate ? list.filter(t => !t.deleted) : list;
  if (ctx === 'detail') return list.filter(t => !t.deleted);
  return list;
}

function taskRow(t, ctx) {
  const cls = t.deleted ? 'is-deleted' : t.done ? 'is-done' : '';
  const src = ctx === 'aggregate' && t.source ? `<span class="task-src">${t.source === 'journal' ? '日志' : '描述'}</span>` : '';
  const date = ctx === 'aggregate' ? `<span class="task-date">${t.day.slice(5)}</span>` : '';
  return `<div class="task-row ${cls}" data-task="${t.id}">
    <input type="checkbox" data-change="toggle-task" data-id="${t.id}" ${t.done ? 'checked' : ''} aria-label="完成任务">
    <button type="button" class="task-body" data-action="edit-task" data-id="${t.id}">${esc(t.body)}</button>
    ${src}${date}
    <button type="button" class="task-del" data-action="delete-task" data-id="${t.id}" title="${t.deleted ? '撤销删除' : '删除任务'}">${t.deleted ? '↺' : '×'}</button>
  </div>`;
}

function renderTasks(list, ctx, emptyText) {
  const out = sortTasks(visibleTasks(list, ctx));
  if (!out.length) return `<p class="task-empty">${emptyText || '没有任务。'}</p>`;
  return `<div class="task-rows">${out.map(t => taskRow(t, ctx)).join('')}</div>`;
}

/* 从 Markdown 重新识别任务：缺失标记的任务物理删除 */
function parseTasks(text) {
  return String(text || '').split('\n').map(line => TASK_RE.exec(line)).filter(Boolean)
    .map(m => ({ body: m[2].trim(), done: m[1].toLowerCase() === 'x' })).filter(t => t.body);
}

function syncSourceTasks(spec, text) {
  const parsed = parseTasks(text);
  const sameSource = t => spec.itemId
    ? (t.itemId === spec.itemId && t.source === 'desc')
    : (t.journalId === spec.journalId && t.source === 'journal');
  const existing = state.tasks.filter(sameSource);
  const keep = new Set();
  for (const p of parsed) {
    const hit = existing.find(x => x.body === p.body && !keep.has(x.id));
    if (hit) { hit.done = p.done; keep.add(hit.id); }
    else {
      const nt = {
        id: 't' + nextId++, body: p.body, done: p.done, deleted: false,
        day: spec.day || state.day, source: spec.source,
        ...(spec.itemId ? { itemId: spec.itemId } : { journalId: spec.journalId }),
      };
      state.tasks.push(nt); keep.add(nt.id);
    }
  }
  state.tasks = state.tasks.filter(t => !sameSource(t) || keep.has(t.id));
}

  f.audio_summary.value = item ? (item.audio_summary || '') : '';
  dlgItem.querySelector('[data-action="delete-item"]').hidden = !item;
  dlgItem.showModal();
}

function saveItem() {
  const f = dlgItem.querySelector('form');
  if (!f.title.value.trim()) { toast('请填写标题'); return; }
  const id = dlgItem.dataset.id;
  const date = f.date.value || state.day;
  let item = id ? state.items.find(i => i.id === id) : null;
  if (!item) {
    item = { id: 'e' + nextId++, corrections: [], journal: null };
    state.items.push(item);
  }
  Object.assign(item, {
    date,
    start_at: `${date}T${f.start.value || '09:00'}:00`,
    end_at: `${date}T${f.end.value || '10:00'}:00`,
    title: f.title.value.trim(),
    keywords: f.keywords.value.split(/[,，、;；\s]+/).map(x => x.trim()).filter(Boolean),
    description: f.description.value,
    audio_summary: f.audio_summary.value,
  });
  syncSourceTasks({ itemId: item.id, source: 'desc', day: date }, item.description);
  state.tasks.forEach(t => {
    if (t.itemId === item.id || (item.journal && t.journalId === item.journal.id)) t.day = date;
  });
  state.selectedId = item.id;
  dlgItem.close();
  render();
  toast('日程已保存；Markdown 里的任务已重新识别');
}

function deleteItem() {
  const id = dlgItem.dataset.id;
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  if (!confirm(`删除「${item.title}」？其 Markdown 任务也会一并移除。`)) return;
  const journalId = item.journal && item.journal.id;
  state.items = state.items.filter(i => i.id !== id);
  state.tasks = state.tasks.filter(t => t.itemId !== id && t.journalId !== journalId);
  state.selectedId = null;
  dlgItem.close();
  render();
  toast('日程已删除');
}

function openJournalDialog(itemId, journalId) {
  const item = state.items.find(i => i.id === itemId);
  if (!item || !item.journal) return;
  dlgJournal.dataset.item = itemId;
  dlgJournal.dataset.journal = journalId;
  dlgJournal.querySelector('textarea').value = item.journal.content || '';
  dlgJournal.showModal();
}

function saveJournal() {
  const item = state.items.find(i => i.id === dlgJournal.dataset.item);
  if (!item || !item.journal) return;
  item.journal.content = dlgJournal.querySelector('textarea').value;
  syncSourceTasks({ journalId: item.journal.id, source: 'journal', day: item.date }, item.journal.content);
  dlgJournal.close();
  render();
  toast('日志已保存；任务已按 Markdown 重新识别');
}

function openTaskDialog(id) {
  const t = findTask(id);
  if (!t) return;
  dlgTask.dataset.id = id;
  dlgTask.querySelector('input[name=body]').value = t.body;
  dlgTask.showModal();
}

function saveTask() {
  const t = findTask(dlgTask.dataset.id);
  if (!t) return;
  const v = dlgTask.querySelector('input[name=body]').value.trim();
  if (!v) { toast('任务内容不能为空'); return; }
  t.body = v;
  dlgTask.close();
  render();
}

function openCorrectionDialog(itemId, corrId) {
  const item = state.items.find(i => i.id === itemId);
  if (!item) return;
  const c = corrId ? item.corrections.find(x => x.id === corrId) : null;
  dlgCorrection.dataset.item = itemId;
  dlgCorrection.dataset.corr = corrId || '';
  dlgCorrection.querySelector('h2').textContent = c ? '编辑纠正' : '新增纠正';
  dlgCorrection.querySelector('textarea').value = c ? c.note : '';
  dlgCorrection.showModal();
}

function saveCorrection() {
  const item = state.items.find(i => i.id === dlgCorrection.dataset.item);
  if (!item) return;
  const note = dlgCorrection.querySelector('textarea').value.trim();
  if (!note) { toast('纠正内容不能为空'); return; }
  const corrId = dlgCorrection.dataset.corr;
  if (corrId) {
    const c = item.corrections.find(x => x.id === corrId);
    if (c) { c.note = note; c.created_at = new Date().toISOString(); }
  } else {
    item.corrections.push({ id: 'c' + nextId++, note, created_at: new Date().toISOString() });
  }
  dlgCorrection.close();
  render();
  toast('纠正已保存');
}

function switchTab(tab) {
  state.ui.tab = tab;
  render();
  window.scrollTo(0, 0);
}

stage.addEventListener('click', e => {
  if (e.target.closest('input[type=checkbox]')) return;
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  switch (action) {
    case 'select-item':
      state.selectedId = el.dataset.id;
      render();
      break;
    case 'edit-item': openItemDialog(el.dataset.id); break;
    case 'add-item': openItemDialog(null); break;
    case 'save-item': saveItem(); break;
    case 'delete-item': deleteItem(); break;
    case 'edit-journal': openJournalDialog(el.dataset.item, el.dataset.journal); break;
    case 'save-journal': saveJournal(); break;
    case 'edit-task': openTaskDialog(el.dataset.id); break;
    case 'save-task': saveTask(); break;
    case 'delete-task': {
      const t = findTask(el.dataset.id);
      if (t) { t.deleted = !t.deleted; render(); toast(t.deleted ? '任务已删除，只在当日日程中显示' : '任务已恢复'); }
      break;
    }
    case 'add-correction': openCorrectionDialog(el.dataset.item, null); break;
    case 'edit-correction': openCorrectionDialog(el.dataset.item, el.dataset.corr); break;
    case 'save-correction': saveCorrection(); break;
    case 'delete-correction': {
      const item = state.items.find(i => i.id === el.dataset.item);
      if (item) { item.corrections = item.corrections.filter(c => c.id !== el.dataset.corr); render(); toast('纠正已删除'); }
      break;
    }
    case 'tab': switchTab(el.dataset.tab); break;
    case 'toggle-left': state.ui.leftOpen = !state.ui.leftOpen; render(); break;
    case 'toggle-right': state.ui.rightOpen = !state.ui.rightOpen; render(); break;
    case 'prev-day': shiftDay(-1); break;
    case 'next-day': shiftDay(1); break;
    case 'today':
      state.day = todayStr();
      { const d = parseDay(state.day); state.calY = d.getFullYear(); state.calM = d.getMonth() + 1; }
      state.selectedId = null;
      render();
      break;
    case 'pick-day': {
      state.day = el.dataset.date;
      const d = parseDay(state.day);
      state.calY = d.getFullYear();
      state.calM = d.getMonth() + 1;
      state.selectedId = null;
      render();
      break;
    }
    case 'prev-month':
      state.calM--; if (state.calM < 1) { state.calM = 12; state.calY--; }
      render();
      break;
    case 'next-month':
      state.calM++; if (state.calM > 12) { state.calM = 1; state.calY++; }
      render();
      break;
    case 'this-month': {
      const d = parseDay(state.day);
      state.calY = d.getFullYear(); state.calM = d.getMonth() + 1;
      render();
      break;
    }
    case 'sync': toast('已触发同步（原型模拟）'); break;
    case 'reveal-key': {
      const input = el.closest('.keyrow') && el.closest('.keyrow').querySelector('input');
      if (input) input.type = input.type === 'password' ? 'text' : 'password';
      break;
    }
    case 'save-settings':
      stage.querySelectorAll('[data-set]').forEach(input => {
        const key = input.dataset.set;
        state.settings[key] = input.type === 'checkbox' ? input.checked : input.value;
      });
      state.settings.hideDeletedAggregate = !!stage.querySelector('[data-set=hide_deleted_aggregate]')?.checked;
      toast('设置已保存（原型模拟）');
      break;
  }
});

stage.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  if (el.dataset.change === 'toggle-task') {
    const t = findTask(el.dataset.id);
    if (t) { t.done = el.checked; render(); }
  } else if (el.dataset.change === 'img-mode') {
    state.settings.imageMode = el.value;
    stage.querySelectorAll('.img-fields').forEach(f => { f.hidden = f.dataset.mode !== el.value; });
  }
});

/* 顶部菜单滚动隐藏 */
let lastScrollY = window.scrollY;
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  stage.querySelectorAll('.topbar,.page-head,.cbar').forEach(bar => {
    if (y > 110 && y > lastScrollY + 4) bar.classList.add('hide');
    else if (y < lastScrollY - 4 || y < 60) bar.classList.remove('hide');
  });
  lastScrollY = y;
}, { passive: true });

/* 版本切换 */
document.querySelectorAll('#protoBar button').forEach(btn => {
  btn.addEventListener('click', () => {
    state.version = btn.dataset.v;
    document.querySelectorAll('#protoBar button').forEach(b => b.classList.toggle('on', b === btn));
    render();
    window.scrollTo(0, 0);
  });
});

render();
</script>
</body>
</html>
