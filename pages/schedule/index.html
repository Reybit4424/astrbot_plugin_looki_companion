<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Looki 日程</title>
<style>
:root{
  --bg:#f4f7f5;--surface:#fff;--line:#e2e9e5;--text:#222a26;--muted:#65716b;
  --accent:#176b56;--accent-soft:#e9f2ee;--dot:#e0a908;
  --clue-bg:#fdf7e7;--clue-line:#ecd9a4;--clue-text:#7d6218;
  --r:12px;
  font:14px/1.55 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  color:var(--text);background:var(--bg);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh}
h1,h2,h3{margin:0;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- 顶栏 / 标签页 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px 20px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:26px;height:26px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.brand h1{font-size:16px;white-space:nowrap}
.status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.status.err{color:#b4451f}
.tabs{display:flex;gap:2px;padding:3px;background:#eef2f0;border-radius:10px}
.tab{border:none;background:none;padding:6px 16px;border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer}
.tab.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.acts{margin-left:auto;display:flex;gap:8px}

/* ---------- 通用控件 ---------- */
button{cursor:pointer}
.primary{background:var(--accent);border:1px solid var(--accent);color:#fff;padding:7px 14px;border-radius:8px}
.primary:hover{background:#125a48}
.primary:disabled{opacity:.55;cursor:default}
.icon{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:8px;color:var(--muted);line-height:1.2}
.icon:hover{background:#f2f6f4;color:var(--text)}
.ghost{border:none;background:none;padding:4px 6px;border-radius:6px;color:var(--muted);font-size:12px}
.ghost:hover{background:var(--accent-soft);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(20,40,32,.04)}
.initial-import{grid-column:1/-1;border-color:var(--accent)}
.initial-import h2{font-size:17px;margin-bottom:8px}
.initial-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.initial-message{margin:12px 0 0;color:#b4451f;font-size:13px}
.icon:disabled{opacity:.55;cursor:default}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.card-head h2{font-size:15px}
.head-acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.meta{margin:2px 0 0;font-size:12px;color:var(--muted)}
.meta.err{color:#b4451f}
.hint{font-size:12px;color:var(--muted);margin-left:auto}

/* ---------- 主布局：左时间轴 / 右月视图+当日详情 ---------- */
.layout{
  display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;
  align-items:start;padding:16px 20px 28px;max-width:1500px;margin:0 auto;
}
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:66px;max-height:calc(100vh - 82px)}
.side-body{display:flex;flex-direction:column;gap:16px;flex:1;min-height:0;overflow-y:auto;padding-right:2px}
.side-head{display:none;align-items:center;gap:8px;flex-shrink:0}
.side-head h2{font-size:15px}
.side-foot{
  flex-shrink:0;border:1px dashed var(--line);border-radius:var(--r);
  padding:12px 14px;font-size:12px;color:var(--muted);text-align:center;
}
.side-backdrop{display:none}
.layout.side-hidden{grid-template-columns:minmax(0,1fr)}
.layout.side-hidden .side{display:none}
body.side-lock{overflow:hidden}

/* 侧栏内数据居中 */
.side .cal-head,.side .card-head{flex-direction:column;align-items:center;gap:6px;text-align:center}
.side .cal-head .head-acts,.side .card-head .head-acts,.side .card-head .hint{margin-left:0}
.side .legend{justify-content:center;text-align:center;flex-wrap:wrap}
.side .out-row{display:flex;justify-content:center;align-items:baseline;gap:8px;text-align:center}
.side .out-row .out-time{flex:none}
.side .out-title{text-align:center}
.side .placeholder{text-align:center}

@media(max-width:960px){
  .layout{grid-template-columns:1fr}
  .status{max-width:34vw}
  .side{
    position:fixed;top:0;right:0;bottom:0;z-index:40;max-height:none;
    width:min(86vw,360px);gap:12px;background:var(--bg);
    border-left:1px solid var(--line);box-shadow:-14px 0 34px rgba(20,40,32,.16);
    padding:calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));
    transform:translateX(100%);transition:transform .25s ease;
  }
  .side.open{transform:translateX(0)}
  .side-head{display:flex}
  .side-head .icon{margin-left:auto}
  .layout.side-hidden .side{display:flex}
  .side-backdrop.show{display:block;position:fixed;inset:0;z-index:39;background:rgba(18,30,24,.34)}
}

/* ---------- 时间轴 ---------- */
.timeline{display:grid;gap:10px}
.tl-item{
  display:grid;grid-template-columns:64px 1fr;gap:12px;
  padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  cursor:pointer;transition:border-color .15s,box-shadow .15s,background .15s;
}
.tl-item:hover{border-color:#c3d6cd;background:#fbfdfc}
.tl-item.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:#fcfefd}
.tl-time{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;font-weight:600;line-height:1.35;padding-top:1px}
.tl-time span{display:block;color:var(--muted);font-weight:400}
.tl-body{min-width:0}
.tl-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-weight:600}
.badge{font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:#2b6153}
.badge.manual{background:#eef0f7;color:#4a5580}
.tl-ops{visibility:hidden;margin-left:auto;display:flex;gap:2px}
.tl-item:hover .tl-ops,.tl-item.sel .tl-ops{visibility:visible}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chips i{font-style:normal;font-size:11.5px;background:var(--accent-soft);color:#2c5c4d;border-radius:999px;padding:1px 9px}
.tl-tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin-top:9px}
.tl-tag::before{content:"";width:4px;height:4px;border-radius:50%;background:#a9b6b0}
.tl-desc{margin:4px 0 0;font-size:13px;color:#4a554f;line-height:1.75;white-space:pre-wrap}
.tl-tag+.chips{margin-top:6px}
.tl-audio{border-left:3px solid var(--clue-line);background:var(--clue-bg);border-radius:0 8px 8px 0;padding:8px 11px;margin-top:10px}
.tl-audio-tag{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--clue-text);margin-bottom:4px}
.tl-audio-tag::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--dot)}
.tl-audio p{margin:0;font-size:12.5px;line-height:1.75;color:#5d4c12;white-space:pre-wrap}
.tl-corrections{margin-top:10px;padding:8px 11px;border:1px solid #c9ddd4;border-radius:8px;background:var(--accent-soft)}
.tl-correction-head{font-size:11px;font-weight:600;color:var(--accent);margin-bottom:4px}
.tl-correction+.tl-correction{border-top:1px solid #d5e5dd;margin-top:7px;padding-top:7px}
.tl-correction p{margin:0;font-size:12.5px;line-height:1.75;color:#315c4d;white-space:pre-wrap}
.tl-correction time{display:block;margin-top:3px;font-size:11px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:36px 0;font-size:13px}
.recording{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;font-size:13px;color:var(--clue-text);background:var(--clue-bg);border:1px dashed var(--clue-line);border-radius:10px}
.recording .pulse{width:7px;height:7px;border-radius:50%;background:var(--dot);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- 月视图 ---------- */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-head h2{font-size:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-grid .dow{font-size:11px;color:var(--muted);text-align:center;padding:2px 0 4px}
.cell{
  position:relative;min-height:40px;border:1px solid transparent;border-radius:8px;background:none;
  padding:3px 0 8px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums;
}
.cell:hover{background:#f1f6f3}
.cell.out{color:#c2ccc7}
.cell.sel{border-color:var(--accent);background:var(--accent-soft)}
.cell.today .num{background:var(--accent);color:#fff;border-radius:50%}
.cell .num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px}
.dots{position:absolute;left:0;right:0;bottom:3px;display:flex;gap:2px;justify-content:center}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--dot)}
.legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend i{width:5px;height:5px;border-radius:50%;background:var(--dot)}

/* ---------- 视图工具与媒体 ---------- */
.tl-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.seg{display:flex;gap:2px;padding:2px;background:#eef2f0;border-radius:8px}
.seg button{border:none;background:none;padding:4px 11px;border-radius:6px;font-size:12px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.inline-check{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
.inline-check input{width:auto;margin:0}
.range-hint{font-size:11.5px;color:var(--muted);margin-left:auto}
.media-badges{display:inline-flex;gap:4px;flex-wrap:wrap}
.media-badge{font-size:10.5px;font-weight:500;padding:0 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#f7faf8}
.media-badge.photo{background:#eaf3fb;border-color:#cfe2f2;color:#2f5f86}
.media-badge.video{background:#f3eefb;border-color:#ded2f0;color:#5a4680}
.media-badge.audio{background:var(--clue-bg);border-color:var(--clue-line);color:var(--clue-text)}
.media-badge.transcript,.media-badge.summary{background:#eef4f1;border-color:#d5e5dd;color:#2e5f50}
.media-badge.unknown{background:#f4f5f4}
.tl-untitled{color:var(--muted);font-style:italic;font-weight:500}
.tl-evidence{margin-top:10px;padding:8px 11px;border:1px dashed #cbd6d1;border-radius:8px;background:#fafcfb;display:grid;gap:6px}
.ev-row{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:12px;color:var(--muted)}
.ev-meta{font-size:11.5px}
.ev-excerpt{margin:0;font-size:12.5px;line-height:1.7;color:#4a554f;white-space:pre-wrap}
.ev-infer{display:inline-block;margin-right:6px;font-size:10.5px;color:var(--clue-text);background:var(--clue-bg);border:1px dashed var(--clue-line);border-radius:999px;padding:0 6px}
.agg-row{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
.agg-row:hover{border-color:#c3d6cd;background:#fbfdfc}
.agg-date{font-size:12.5px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.agg-main{min-width:0;font-size:12.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agg-meta{font-size:11.5px;color:var(--muted);white-space:nowrap}
@media(max-width:600px){
  .tl-item{grid-template-columns:52px minmax(0,1fr);gap:10px}
  .tl-tools{gap:6px}
  .agg-row{grid-template-columns:92px minmax(0,1fr)}
  .agg-meta{display:none}
}

/* ---------- 当天时间轴目录 ---------- */
.outline{display:grid;gap:1px;max-height:46vh;overflow:auto}
.out-row{
  display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:baseline;
  border:none;background:none;padding:7px 8px;border-radius:8px;text-align:left;
}
.out-row:hover{background:#f1f6f3}
.out-row.cur{background:var(--accent-soft)}
.out-time{font-size:12px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.out-title{
  font-size:13px;line-height:1.45;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.out-row.cur .out-title{font-weight:600;color:var(--accent)}
.placeholder{font-size:12.5px;color:var(--muted);line-height:1.75;margin:0}

/* ---------- 设置页 ---------- */
.settings{max-width:860px;margin:20px auto;padding:24px}
.settings h2{font-size:17px}
.settings h3{grid-column:1/-1;margin-top:10px;padding-top:16px;border-top:1px solid var(--line);font-size:14px}
.settings .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:16px}
.settings .grid2 label{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
.settings .grid2 label input{width:100%}
.settings .grid2 label.full{grid-column:1/-1}
.settings .checks{display:grid;gap:9px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--text);cursor:pointer}
.check input{width:auto;margin-top:3px}
.check small{display:block;color:var(--muted);font-size:11.5px;line-height:1.6}
.settings .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=datetime-local],select,textarea{
  padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.keyrow{display:flex;gap:6px}
.keyrow input{flex:1}

/* ---------- 编辑弹窗 ---------- */
dialog{width:min(520px,94vw);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 20px 50px rgba(20,40,32,.16)}
dialog::backdrop{background:rgba(24,38,31,.32)}
dialog h2{font-size:16px;margin-bottom:14px}
dialog form{display:grid;gap:11px}
dialog label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
dialog menu{display:flex;gap:8px;justify-content:flex-end;padding:0;margin:6px 0 0}
dialog menu button{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;font-size:13px}
dialog menu button.primary{border-color:var(--accent)}
dialog menu button.danger{color:#b4451f;border-color:#ecc9bd}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">◔</span><h1>Looki 日程</h1><span class="status" id="status">正在读取同步状态…</span></div>
  <nav class="tabs"><button class="tab active" id="tabPlan">日程</button><button class="tab" id="tabSettings">设置</button></nav>
  <div class="acts"><button class="icon" id="sideToggle" aria-controls="sidePanel" aria-expanded="true" title="日历与目录">▤</button><button class="primary" id="sync">立即同步</button></div>
</header>

<main class="layout" id="viewPlan">
  <section class="card initial-import" id="initialImport" hidden>
    <h2>是否导入 Looki 历史日程？</h2>
    <p class="meta" id="initialImportRange"></p>
    <p class="meta">保存 API Key 不会自动导入。选择“暂不导入”不会在此次操作中请求 Looki，之后仍可使用“立即同步”。</p>
    <div class="initial-actions">
      <button class="primary" id="initialImportYes">导入历史日程</button>
      <button class="icon" id="initialImportSkip">暂不导入</button>
    </div>
    <p class="initial-message" id="initialImportMessage" hidden></p>
  </section>
  <section class="card">
    <div class="card-head">
      <div><h2 id="dayTitle"></h2><p class="meta" id="dayMeta"></p></div>
      <div class="head-acts">
        <button class="icon" id="dPrev" title="前一天">‹</button>
        <button class="icon" id="dToday">今天</button>
        <button class="icon" id="dNext" title="后一天">›</button>
        <button class="primary" id="add">补录</button>
      </div>
    </div>
    <div class="tl-tools">
      <div class="seg" id="scaleSwitch"><button type="button" data-scale="day" class="on">日</button><button type="button" data-scale="week">周</button><button type="button" data-scale="month">月</button></div>
      <div class="seg" id="mediaFilters"><button type="button" data-media="all" class="on">全部</button><button type="button" data-media="photo">照片</button><button type="button" data-media="video">视频</button><button type="button" data-media="audio">音频</button><button type="button" data-media="transcript">摘要/转写</button></div>
      <label class="inline-check"><input type="checkbox" id="onlyEvidence">仅有证据</label>
      <span class="range-hint">周/月为聚合视图，点击某天进入日视图</span>
    </div>
    <div class="timeline" id="timeline"></div>
  </section>

  <aside class="side" id="sidePanel" aria-label="日历与当天时间轴">
    <div class="side-head"><h2>日历与目录</h2><button class="icon" id="sideClose" title="收起侧栏">×</button></div>
    <div class="side-body">
      <section class="card">
        <div class="cal-head">
          <h2 id="calTitle"></h2>
          <div class="head-acts">
            <button class="icon" id="mPrev" title="上一月">‹</button>
            <button class="icon" id="mToday" title="回到本月">•</button>
            <button class="icon" id="mNext" title="下一月">›</button>
          </div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="legend"><i></i>黄点表示当天有日程记录（最多 5 个）</div>
      </section>

      <section class="card">
        <div class="card-head"><h2>当天时间轴</h2><span class="hint">单击跳转到对应时段</span></div>
        <div class="outline" id="outline"></div>
      </section>
    </div>
    <div class="side-foot">未来扩展区域</div>
  </aside>
  <div class="side-backdrop" id="sideBackdrop"></div>
</main>

<main class="card settings" id="viewSettings" hidden>
  <h2>插件设置</h2>
  <p class="meta" id="cfgNotice">保存后写入插件配置；自动同步按新的间隔重新计时。</p>
  <div class="grid2">
    <label class="full">Looki API Key
      <div class="keyrow"><input id="cfgKey" type="password" autocomplete="off"><button type="button" class="icon" id="eye" title="显示/隐藏">👁</button></div>
      <small>保持掩码不修改，留空保存可清除密钥</small>
    </label>
    <label class="full">接口地址<input id="cfgUrl" placeholder="https://open.looki.tech/api/v1"></label>
    <label>同步间隔（分钟）<input id="cfgInterval" type="number" min="1" max="1440"></label>
    <label>回填天数<input id="cfgBackfill" type="number" min="1" max="366"></label>
    <label>时区<input id="cfgTz" placeholder="Asia/Shanghai"></label>
    <label>请求超时（秒）<input id="cfgTimeout" type="number" min="5" max="120"></label>
    <label>线索天数<input id="cfgClueDays" type="number" min="1" max="31"></label>
    <label>线索条数上限<input id="cfgMaxClues" type="number" min="0" max="10"></label>
    <label>线索注入范围<select id="cfgScope"><option>仅对管理成员开放</option><option>关闭</option></select></label>
    <h3>访问与白名单</h3>
    <label>白名单成员 ID<textarea id="cfgWhitelistUsers" rows="3" placeholder="每行一个，也可用逗号分隔"></textarea></label>
    <label>白名单群 ID<textarea id="cfgWhitelistGroups" rows="3" placeholder="每行一个，也可用逗号分隔"></textarea></label>
    <h3>图片与模型</h3>
    <label>候选图片数量<input id="cfgImageCount" type="number" min="1" max="9"></label>
    <label>挑图多模态模型<select id="cfgSelectionProvider"><option value="">跟随当前对话模型</option></select></label>
    <label id="fieldGenerationMode">图生图方式<select id="cfgGenerationMode"><option value="multimodal">AstrBot 多模态模型</option><option value="openai_compatible">兼容图生图接口</option></select></label>
    <label id="fieldGenerationProvider">图生图多模态模型<select id="cfgGenerationProvider"><option value="">跟随挑图模型</option></select></label>
    <label class="full" id="fieldImageStyle">默认图生图风格<textarea id="cfgImageStyle" rows="3"></textarea></label>
    <label class="full" id="fieldImageApiUrl">兼容图生图接口地址<input id="cfgImageApiUrl" placeholder="/v1、完整 /images/edits 或 /images/generations"></label>
    <label id="fieldImageApiModel">兼容图生图模型<input id="cfgImageApiModel" placeholder="模型名称"></label>
    <label id="fieldImageApiKey">兼容接口 API Key<input id="cfgImageApiKey" type="password" autocomplete="off"><small>保持掩码不修改，留空保存可清除；无密钥接口可留空</small></label>
  </div>
  <div class="checks">
    <label class="check"><input id="cfgAuto" type="checkbox"><span>自动后台同步<small>按设定间隔轮询；首次连接需先完成历史日程导入选择</small></span></label>
    <label class="check"><input id="cfgGroup" type="checkbox"><span>在群聊中开放查询<small>总开关默认关闭；白名单成员和白名单群无需开启此项</small></span></label>
    <label class="check"><input id="cfgImageOriginal" type="checkbox"><span>直接发送选中的原图<small>关闭时进行图生图；两种模式都会先由模型从候选图中挑选 1 张</small></span></label>
    <label class="check"><input id="cfgRaw" type="checkbox"><span>保存远端原始 JSON<small>含隐私原文，默认关闭，仅供调试</small></span></label>
  </div>
  <div class="foot"><button class="icon" id="cfgCancel">取消</button><button class="primary" id="cfgSave">保存设置</button></div>
</main>

<dialog id="editor"><form method="dialog">
  <h2 id="formTitle">日程</h2>
  <label>日期<input name="date" type="date" required></label>
  <label>标题<input name="title" maxlength="200" required></label>
  <div class="row2"><label>开始时间<input name="start" type="datetime-local" required></label><label>结束时间<input name="end" type="datetime-local" required></label></div>
  <label>关键词（逗号分隔）<input name="keywords"></label>
  <label>描述<textarea name="description" rows="5"></textarea></label>
  <label>音频摘要<textarea name="audio_summary" rows="5"></textarea></label>
  <menu><button value="cancel">取消</button><button type="button" class="danger" id="delete">删除</button><button type="button" class="primary" id="save">保存</button></menu>
</form></dialog>

<script src="/api/plugin/page/bridge-sdk.js"></script>
<script type="module">
const bridge=window.AstrBotPluginPage;await bridge.ready();
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hhmm=s=>{const d=new Date(s);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const localDT=s=>{const d=new Date(s);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const todayStr=()=>fmt(new Date());
const WEEK='日一二三四五六';

let calY,calM,day=todayStr(),items=[],selectedId=null,syncing=false,initialImportBusy=false,scale='day',mediaFilter='all',onlyEvidence=false,evidence={};
{const n=new Date();calY=n.getFullYear();calM=n.getMonth()+1}
const dialog=$('editor'),form=dialog.querySelector('form');

/* ---------- 右侧栏：收起 / 拉出 ---------- */
const sideEl=$('sidePanel'),sideBtn=$('sideToggle'),sideBackdrop=$('sideBackdrop');
const narrow=()=>window.matchMedia('(max-width:960px)').matches;
let sideOpen=!narrow();
function setSide(open,lockScroll=true){
  sideOpen=open;
  $('viewPlan').classList.toggle('side-hidden',!narrow()&&!open);
  sideEl.classList.toggle('open',open);
  sideBackdrop.classList.toggle('show',narrow()&&open);
  sideBtn.setAttribute('aria-expanded',String(open));
  document.body.classList.toggle('side-lock',narrow()&&open&&lockScroll);
}
sideBtn.onclick=()=>setSide(!sideOpen);
$('sideClose').onclick=()=>setSide(false);
sideBackdrop.onclick=()=>setSide(false);
addEventListener('keydown',e=>{if(e.key==='Escape'&&narrow()&&sideOpen)setSide(false)});
addEventListener('resize',()=>setSide(sideOpen,false));
setSide(sideOpen);

/* ---------- 标签页 ---------- */
function switchTab(settings){
  $('tabPlan').classList.toggle('active',!settings);
  $('tabSettings').classList.toggle('active',settings);
  $('viewPlan').hidden=settings;
  $('viewSettings').hidden=!settings;
  if(settings&&narrow())setSide(false);
}
$('tabPlan').onclick=()=>switchTab(false);
$('tabSettings').onclick=async()=>{switchTab(true);await loadConfig()};

/* ---------- 月视图 ---------- */
async function loadCalendar(){
  $('calTitle').textContent=`${calY} 年 ${calM} 月`;
  let density={};try{density=await bridge.apiGet('density',{year:calY,month:calM})}catch(e){}
  const grid=$('calGrid');grid.replaceChildren();
  for(const w of ['一','二','三','四','五','六','日']){const el=document.createElement('div');el.className='dow';el.textContent=w;grid.append(el)}
  const first=new Date(calY,calM-1,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const s=fmt(d),out=d.getMonth()+1!==calM;
    const cell=document.createElement('button');cell.type='button';
    cell.className='cell'+(out?' out':'')+(s===todayStr()?' today':'')+(s===day?' sel':'');
    const num=document.createElement('span');num.className='num';num.textContent=d.getDate();cell.append(num);
    const count=density[s]||0;
    if(count>0){
      const dots=document.createElement('span');dots.className='dots';
      for(let k=0;k<Math.min(count,5);k++)dots.append(document.createElement('i'));
      cell.append(dots);cell.title=`${s}：${count} 条日程`;
    }else if(s===todayStr()){cell.title='今天（暂无数据）'}
    cell.onclick=()=>{
      if(out){calY=d.getFullYear();calM=d.getMonth()+1}
      day=s;selectedId=null;
      if(scale!=='day'){scale='day';syncScaleUI()}
      loadCalendar();loadPlan();
    };
    grid.append(cell);
  }
}
$('mPrev').onclick=()=>{calM--;if(calM<1){calM=12;calY--}loadCalendar();if(scale==='month')loadPlan()};
$('mNext').onclick=()=>{calM++;if(calM>12){calM=1;calY++}loadCalendar();if(scale==='month')loadPlan()};
$('mToday').onclick=()=>{const n=new Date();calY=n.getFullYear();calM=n.getMonth()+1;day=todayStr();selectedId=null;loadCalendar();loadPlan()};

/* ---------- 视图、筛选与时间轴 ---------- */
const parseDay=s=>new Date(`${s}T00:00:00`);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mediaLabel=t=>({photo:'照片',video:'视频',audio:'音频',transcript:'转写',summary:'摘要',unknown:'未知'}[t]||String(t||'未知'));
const syncCalToDay=()=>{const d=parseDay(day);calY=d.getFullYear();calM=d.getMonth()+1};
const emptyBox=text=>{const el=document.createElement('div');el.className='empty';el.textContent=text;return el};
function syncScaleUI(){for(const b of $('scaleSwitch').children)b.classList.toggle('on',b.dataset.scale===scale)}
function setScale(next){scale=next;syncScaleUI();if(scale!=='day')syncCalToDay();loadPlan()}
function mediaBadge(type){const el=document.createElement('span');el.className='media-badge '+(type||'unknown');el.textContent=mediaLabel(type);return el}
function mediaTypes(item){
  const set=new Set((item.media_types||[]).filter(t=>t&&t!=='unknown'));
  for(const row of (evidence[item.looki_id]||[]))if(row.media_type&&row.media_type!=='unknown')set.add(row.media_type);
  return [...set];
}
function allMediaTypes(item,counts){
  const set=new Set(mediaTypes(item));
  if(counts)for(const t of Object.keys(counts))if(t&&t!=='unknown')set.add(t);
  return [...set];
}
function matches(item,counts){
  const types=allMediaTypes(item,counts);
  if(mediaFilter!=='all'){
    const wanted=mediaFilter==='transcript'?['transcript','summary']:[mediaFilter];
    if(!types.some(t=>wanted.includes(t)))return false;
  }
  return !onlyEvidence||types.length>0;
}
function mediaBadges(item,counts){
  const wrap=document.createElement('span');wrap.className='media-badges';
  const types=allMediaTypes(item,counts);
  if(!types.length)wrap.append(mediaBadge('unknown'));
  else for(const t of types)wrap.append(mediaBadge(t));
  return wrap;
}
function evidenceBox(entries){
  const box=document.createElement('div');box.className='tl-evidence';box.hidden=true;
  for(const entry of entries){
    const row=document.createElement('div');row.className='ev-row';
    row.append(mediaBadge(entry.media_type||'unknown'));
    const bits=[];
    if(entry.width&&entry.height)bits.push(`${entry.width}×${entry.height}`);
    if(entry.duration_ms)bits.push(`${Math.round(entry.duration_ms/1000)} 秒`);
    if(entry.mime_type)bits.push(entry.mime_type);
    if(entry.has_thumbnail)bits.push('有缩略图');
    if(entry.availability==='denied')bits.push('不可直接访问');
    if(entry.availability==='unsupported')bits.push('类型暂不支持');
    const meta=document.createElement('span');meta.className='ev-meta';meta.textContent=bits.join(' · ');
    row.append(meta);box.append(row);
    if(entry.text_excerpt){
      const p=document.createElement('p');p.className='ev-excerpt';
      const tag=document.createElement('span');tag.className='ev-infer';tag.textContent='摘要推测 · 非原始录音';
      p.append(tag);
      p.append(document.createTextNode(entry.text_excerpt));
      box.append(p);
    }
  }
  return box;
}
async function loadPlan(){
  if(scale==='week')return loadWeek();
  if(scale==='month')return loadMonth();
  return loadDay();
}

async function loadDay(){
  const d=parseDay(day);
  $('dayTitle').textContent=`${day} 周${WEEK[d.getDay()]}`;
  const tl=$('timeline');tl.replaceChildren();
  items=[];evidence={};
  try{items=await bridge.apiGet('events',{start:day,end:day})}catch(e){items=[]}
  if(!Array.isArray(items))items=[];
  try{const data=await bridge.apiGet('media',{start:day,end:day});if(data&&typeof data==='object')evidence=data}catch(e){}
  const visible=items.filter(item=>matches(item));
  $('dayMeta').textContent=items.length?`共 ${items.length} 条记录${visible.length!==items.length?` · 筛选后 ${visible.length} 条`:''}`:'';
  if(!items.length){
    tl.append(emptyBox('这一天没有日程记录'));
    if(selectedId!==null){selectedId=null}
    renderOutline([]);
    return;
  }
  if(!visible.length){tl.append(emptyBox('没有符合当前筛选条件的记录'));renderOutline([]);return}
  if(!visible.some(x=>x.id===selectedId))selectedId=null;
  for(const item of visible)tl.append(timelineItem(item));

  if(day===todayStr()){
    const lastEnd=items.reduce((m,x)=>Math.max(m,new Date(x.end_at).getTime()),0);
    if(new Date(lastEnd).getHours()<21){
      const rec=document.createElement('div');rec.className='recording';
      const dot=document.createElement('span');dot.className='pulse';
      rec.append(dot,document.createTextNode('正在记录.ing'));
      tl.append(rec);
    }
  }
  renderOutline(visible);
}

async function loadWeek(){
  const d=parseDay(day),monday=addDays(d,-((d.getDay()+6)%7));
  const start=fmt(monday),end=fmt(addDays(monday,6));
  $('dayTitle').textContent=`${start} ~ ${end} · 周`;
  const tl=$('timeline');tl.replaceChildren();
  items=[];evidence={};
  let counts={};
  try{items=await bridge.apiGet('events',{start,end})}catch(e){items=[]}
  if(!Array.isArray(items))items=[];
  try{counts=await bridge.apiGet('media-summary',{start,end})}catch(e){counts={}}
  const visible=items.filter(item=>matches(item,counts[item.looki_id]));
  $('dayMeta').textContent=items.length?`本周共 ${items.length} 条记录${visible.length!==items.length?` · 筛选后 ${visible.length} 条`:''}`:'';
  if(!visible.length){tl.append(emptyBox('这一周没有符合条件的记录'));renderOutline([]);return}
  const byDay={};
  for(const item of visible)(byDay[item.date]||=[]).push(item);
  for(const dateStr of Object.keys(byDay).sort()){
    const rows=byDay[dateStr],dd=parseDay(dateStr);
    const btn=document.createElement('button');btn.type='button';btn.className='agg-row';
    const date=document.createElement('span');date.className='agg-date';date.textContent=`${dateStr} 周${WEEK[dd.getDay()]}`;
    const main=document.createElement('span');main.className='agg-main';
    main.textContent=`${rows.length} 条 · ${rows.slice(0,3).map(x=>x.title||'未命名记录').join(' / ')}`;
    const meta=document.createElement('span');meta.className='agg-meta';
    meta.textContent=`${hhmm(rows[0].start_at)}–${hhmm(rows[rows.length-1].end_at)}`;
    btn.append(date,main,meta);
    btn.onclick=()=>{day=dateStr;syncCalToDay();setScale('day');loadCalendar()};
    tl.append(btn);
  }
  renderOutline(visible);
}

async function loadMonth(){
  $('dayTitle').textContent=`${calY} 年 ${calM} 月 · 月`;
  const tl=$('timeline');tl.replaceChildren();
  let density={};try{density=await bridge.apiGet('density',{year:calY,month:calM})}catch(e){}
  if(!density||typeof density!=='object')density={};
  const dates=Object.keys(density).sort();
  const total=dates.reduce((sum,s)=>sum+(density[s]||0),0);
  $('dayMeta').textContent=dates.length?`本月 ${dates.length} 天有记录，共 ${total} 条`:'';
  if(!dates.length){tl.append(emptyBox('这个月还没有记录'));renderOutline([]);return}
  for(const dateStr of dates){
    const dd=parseDay(dateStr),count=density[dateStr]||0;
    const btn=document.createElement('button');btn.type='button';btn.className='agg-row';
    const date=document.createElement('span');date.className='agg-date';date.textContent=`${dateStr} 周${WEEK[dd.getDay()]}`;
    const main=document.createElement('span');main.className='agg-main';main.textContent=`${count} 条记录`;
    const meta=document.createElement('span');meta.className='agg-meta';meta.textContent='进入日视图';
    btn.append(date,main,meta);
    btn.onclick=()=>{day=dateStr;calY=dd.getFullYear();calM=dd.getMonth()+1;setScale('day');loadCalendar()};
    tl.append(btn);
  }
  renderOutline([]);
}

function timelineItem(item){
  const row=document.createElement('article');
  row.className='tl-item'+(item.id===selectedId?' sel':'');
  row.id='tl-'+item.id;
  row.dataset.id=item.id;

  const time=document.createElement('div');time.className='tl-time';
  time.append(document.createTextNode(hhmm(item.start_at)));
  const endSpan=document.createElement('span');endSpan.textContent=hhmm(item.end_at);time.append(endSpan);

  const body=document.createElement('div');body.className='tl-body';
  const titleRow=document.createElement('div');titleRow.className='tl-title';
  const title=document.createElement('span');
  if(item.title){title.textContent=item.title}
  else{title.className='tl-untitled';title.textContent='未命名记录'}
  titleRow.append(title,mediaBadges(item));
  if(item.source==='manual'){
    const badge=document.createElement('span');badge.className='badge manual';badge.textContent='手动';titleRow.append(badge);
  }

  const entries=evidence[item.looki_id]||[];
  const ops=document.createElement('span');ops.className='tl-ops';
  if(entries.length){
    const evBtn=document.createElement('button');evBtn.type='button';evBtn.className='ghost';evBtn.textContent='证据';
    evBtn.onclick=e=>{e.stopPropagation();const box=row.querySelector('.tl-evidence');if(box)box.hidden=!box.hidden};
    ops.append(evBtn);
  }
  const editBtn=document.createElement('button');editBtn.type='button';editBtn.className='ghost';editBtn.textContent='编辑';
  editBtn.onclick=e=>{e.stopPropagation();edit(item)};
  ops.append(editBtn);titleRow.append(ops);
  body.append(titleRow);

  if(item.keywords&&item.keywords.length){
    const tag=document.createElement('div');tag.className='tl-tag';tag.textContent='关键词';
    const chips=document.createElement('div');chips.className='chips';
    for(const k of item.keywords){const c=document.createElement('i');c.textContent=k;chips.append(c)}
    body.append(tag,chips);
  }
  if(item.description){
    const tag=document.createElement('div');tag.className='tl-tag';tag.textContent='详细描述 · 仅作线索';
    const p=document.createElement('p');p.className='tl-desc';p.textContent=item.description;
    body.append(tag,p);
  }
  if(item.audio_summary){
    const box=document.createElement('div');box.className='tl-audio';
    const tag=document.createElement('div');tag.className='tl-audio-tag';tag.textContent='音频摘要 · Looki 生成（不是原始录音）';
    const p=document.createElement('p');p.textContent=item.audio_summary;
    box.append(tag,p);body.append(box);
  }
  if(item.corrections&&item.corrections.length){
    const box=document.createElement('div');box.className='tl-corrections';
    const head=document.createElement('div');head.className='tl-correction-head';head.textContent='对话校正 · 以最新注记为准';
    box.append(head);
    for(const correction of item.corrections){
      const note=document.createElement('div');note.className='tl-correction';
      const p=document.createElement('p');p.textContent=correction.note;
      const time=document.createElement('time');time.dateTime=correction.created_at;
      time.textContent=new Date(correction.created_at).toLocaleString('zh-CN');
      note.append(p,time);box.append(note);
    }
    body.append(box);
  }
  if(entries.length)body.append(evidenceBox(entries));
  row.append(time,body);
  row.onclick=()=>select(item.id,false);
  return row;
}

/* ---------- 选中与锚点跳转 ---------- */
function select(id,scroll){
  selectedId=id;
  for(const el of document.querySelectorAll('.tl-item'))el.classList.toggle('sel',el.dataset.id===id);
  for(const el of document.querySelectorAll('.out-row'))el.classList.toggle('cur',el.dataset.id===id);
  if(scroll)document.getElementById('tl-'+id)?.scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---------- 右侧：当天时间轴目录 ---------- */
function renderOutline(items){
  const box=$('outline');box.replaceChildren();
  if(!items||!items.length){
    const p=document.createElement('p');p.className='placeholder';
    p.textContent='这一天还没有日程。同步后会自动出现，单击条目即可跳到左侧对应时段。';
    box.append(p);return;
  }
  for(const item of items){
    const btn=document.createElement('button');btn.type='button';
    btn.className='out-row'+(item.id===selectedId?' cur':'');
    btn.dataset.id=item.id;
    const time=document.createElement('span');time.className='out-time';time.textContent=hhmm(item.start_at);
    const title=document.createElement('span');title.className='out-title';title.textContent=item.title;
    btn.append(time,title);
    btn.onclick=()=>select(item.id,true);
    box.append(btn);
  }
}

function step(dir){
  if(scale==='month'){
    calM+=dir;if(calM<1){calM=12;calY--}else if(calM>12){calM=1;calY++}
    loadCalendar();loadPlan();return;
  }
  const d=parseDay(day);d.setDate(d.getDate()+(scale==='week'?7*dir:dir));
  day=fmt(d);syncCalToDay();selectedId=null;loadCalendar();loadPlan();
}
for(const b of $('scaleSwitch').children)b.onclick=()=>setScale(b.dataset.scale);
for(const b of $('mediaFilters').children){
  b.onclick=()=>{
    mediaFilter=b.dataset.media;
    for(const x of $('mediaFilters').children)x.classList.toggle('on',x===b);
    loadPlan();
  };
}
$('onlyEvidence').onchange=e=>{onlyEvidence=e.target.checked;loadPlan()};
$('dPrev').onclick=()=>step(-1);
$('dNext').onclick=()=>step(1);
$('dToday').onclick=()=>{day=todayStr();syncCalToDay();selectedId=null;loadCalendar();loadPlan()};

/* ---------- 编辑 / 补录 / 删除 ---------- */
function edit(item){
  selectedId=item?.id||null;
  form.reset();
  $('formTitle').textContent=selectedId?'编辑日程':'补录日程';
  form.elements.date.value=item?.date||day;
  form.elements.title.value=item?.title||'';
  form.elements.start.value=item?.start_at?localDT(item.start_at):`${day}T09:00`;
  form.elements.end.value=item?.end_at?localDT(item.end_at):`${day}T10:00`;
  form.elements.keywords.value=(item?.keywords||[]).join(',');
  form.elements.description.value=item?.description||'';
  form.elements.audio_summary.value=item?.audio_summary||'';
  $('delete').hidden=!selectedId;
  dialog.showModal();
}
$('add').onclick=()=>edit();
$('save').onclick=async e=>{
  e.preventDefault();
  if(!form.elements.title.value.trim())return;
  const value={
    date:form.elements.date.value,
    title:form.elements.title.value.trim(),
    start:new Date(form.elements.start.value).toISOString(),
    end:new Date(form.elements.end.value).toISOString(),
    keywords:form.elements.keywords.value.split(/[,，、;；\s]+/).map(x=>x.trim()).filter(Boolean),
    description:form.elements.description.value.trim(),
    audio_summary:form.elements.audio_summary.value.trim(),
  };
  try{
    await bridge.apiPost(selectedId?`events/${selectedId}/update`:'events',value);
    dialog.close();loadCalendar();loadPlan();
  }catch(err){alert('保存失败：'+(err?.message||err))}
};
async function removeItem(item){
  if(!item?.id)return;
  if(!confirm(`删除「${item.title}」？删除后同步不会恢复这条记录。`))return;
  try{
    await bridge.apiPost(`events/${item.id}/delete`,{});
    selectedId=null;
    if(dialog.open)dialog.close();
    loadCalendar();loadPlan();
  }catch(err){alert('删除失败：'+(err?.message||err))}
}
$('delete').onclick=()=>{
  const item=items.find(x=>x.id===selectedId);
  if(item)removeItem(item);
};

/* ---------- 同步与状态 ---------- */
$('sync').onclick=async()=>{
  if(syncing)return;
  syncing=true;$('sync').disabled=true;$('sync').textContent='同步中…';
  try{
    const result=await bridge.apiPost('sync',{});
    if(result.error)throw new Error(result.error);
    await status();loadCalendar();loadPlan();
  }catch(err){alert('同步失败：'+(err?.message||err))}
  finally{syncing=false;$('sync').disabled=false;$('sync').textContent='立即同步'}
};
function renderInitialImport(s){
  $('initialImport').hidden=!s.initial_import_required;
  if(!s.initial_import_required)return;
  $('initialImportRange').textContent=`将读取最近 ${s.backfill_days||7} 天的结构化日程，时区为 ${s.timezone||'Asia/Shanghai'}。`;
}
function setInitialImportBusy(busy){
  initialImportBusy=busy;
  $('initialImportYes').disabled=busy;$('initialImportSkip').disabled=busy;
  $('initialImportYes').textContent=busy?'正在导入…':'导入历史日程';
}
async function chooseInitialImport(choice){
  if(initialImportBusy)return;
  setInitialImportBusy(true);
  $('initialImportMessage').hidden=true;$('initialImportMessage').textContent='';
  try{
    const result=await bridge.apiPost('initial-import',{choice});
    if(choice==='import'&&result.error)throw new Error(result.error);
    if(choice==='import'&&result.initial_import_required)throw new Error(result.skipped?'另一个同步任务正在进行，请稍后重试。':'导入尚未完成，请重试。');
    await status();
    if(choice==='import')await Promise.all([loadCalendar(),loadPlan()]);
  }catch(err){
    $('initialImportMessage').textContent='操作未完成：'+(err?.message||err);
    $('initialImportMessage').hidden=false;
  }finally{setInitialImportBusy(false)}
}
$('initialImportYes').onclick=()=>chooseInitialImport('import');
$('initialImportSkip').onclick=()=>chooseInitialImport('skip');
async function status(){
  try{
    const s=await bridge.apiGet('status');
    renderInitialImport(s);
    const el=$('status');
    el.textContent=`最近成功：${s.last_success?new Date(s.last_success).toLocaleString('zh-CN'):'无'} · 最新数据：${s.latest_event?new Date(s.latest_event).toLocaleDateString('zh-CN'):'无'}`;
    el.classList.toggle('err',!!s.last_error);
    el.title=s.last_error?`最近错误：${s.last_error}`:(s.delay_notice||'');
  }catch(e){$('status').textContent='状态读取失败'}
}

/* ---------- 设置 ---------- */
let keyRevealed=false;
function updateImageFields(){
  const original=$('cfgImageOriginal').checked,mode=$('cfgGenerationMode').value;
  $('fieldGenerationMode').hidden=original;
  $('fieldGenerationProvider').hidden=original||mode!=='multimodal';
  $('fieldImageStyle').hidden=original;
  $('fieldImageApiUrl').hidden=original||mode!=='openai_compatible';
  $('fieldImageApiModel').hidden=original||mode!=='openai_compatible';
  $('fieldImageApiKey').hidden=original||mode!=='openai_compatible';
}
$('cfgGenerationMode').onchange=updateImageFields;
$('cfgImageOriginal').onchange=updateImageFields;
function fillProviders(id,providerIds,current,emptyLabel){
  const select=$(id),ids=Array.isArray(providerIds)?providerIds:[];
  select.replaceChildren(new Option(emptyLabel,''));
  for(const providerId of new Set([...ids,...(current?[current]:[])])){
    const loaded=ids.includes(providerId);
    select.append(new Option(loaded?providerId:`${providerId}（当前未加载）`,providerId));
  }
  select.value=current||'';
}
async function loadConfig(){
  let c;
  try{c=await bridge.apiGet('config')}
  catch(err){
    $('cfgSave').disabled=true;
    $('cfgNotice').textContent='配置读取失败，已禁止保存。请检查插件后端后重试：'+(err?.message||err);
    $('cfgNotice').classList.add('err');
    return;
  }
  $('cfgSave').disabled=false;
  $('cfgNotice').textContent='保存后写入插件配置；自动同步按新的间隔重新计时。';
  $('cfgNotice').classList.remove('err');
  keyRevealed=false;$('cfgKey').type='password';$('cfgKey').value=c.looki_api_key_masked||'';
  $('cfgUrl').value=c.looki_base_url||'';
  $('cfgAuto').checked=!!c.auto_sync;$('cfgScope').value=c.clue_scope||'仅对管理成员开放';
  $('cfgGroup').checked=!!c.allow_group_query;$('cfgRaw').checked=!!c.store_raw_json;
  $('cfgInterval').value=c.sync_interval_minutes;$('cfgBackfill').value=c.backfill_days;
  $('cfgTz').value=c.timezone;$('cfgTimeout').value=c.request_timeout_seconds;
  $('cfgClueDays').value=c.clue_days;$('cfgMaxClues').value=c.max_clues;
  $('cfgWhitelistUsers').value=c.whitelist_user_ids||'';
  $('cfgWhitelistGroups').value=c.whitelist_group_ids||'';
  $('cfgImageCount').value=c.image_candidate_count??6;
  $('cfgImageOriginal').checked=!!c.image_send_original;
  $('cfgImageStyle').value=c.image_style_prompt||'';
  $('cfgGenerationMode').value=c.image_generation_mode||'multimodal';
  fillProviders('cfgSelectionProvider',c.image_provider_ids,c.image_selection_provider_id,'跟随当前对话模型');
  fillProviders('cfgGenerationProvider',c.image_provider_ids,c.image_generation_provider_id,'跟随挑图模型');
  $('cfgImageApiUrl').value=c.image_api_base_url||'';
  $('cfgImageApiModel').value=c.image_api_model||'';
  $('cfgImageApiKey').value=c.image_api_key_masked||'';
  updateImageFields();
}
$('eye').onclick=async()=>{
  keyRevealed=!keyRevealed;
  if(keyRevealed){
    try{const c=await bridge.apiGet('config',{reveal:1});$('cfgKey').value=c.looki_api_key||'';$('cfgKey').type='text'}
    catch(e){keyRevealed=false}
  }else{
    $('cfgKey').type='password';
    try{const c=await bridge.apiGet('config');$('cfgKey').value=c.looki_api_key_masked||''}catch(e){}
  }
};
$('cfgCancel').onclick=async()=>{await loadConfig();switchTab(false)};
$('cfgSave').onclick=async()=>{
  const body={
    looki_api_key:$('cfgKey').value.trim(),looki_base_url:$('cfgUrl').value.trim(),
    auto_sync:$('cfgAuto').checked,clue_scope:$('cfgScope').value,
    allow_group_query:$('cfgGroup').checked,store_raw_json:$('cfgRaw').checked,
    sync_interval_minutes:+$('cfgInterval').value,backfill_days:+$('cfgBackfill').value,
    timezone:$('cfgTz').value.trim(),request_timeout_seconds:+$('cfgTimeout').value,
    clue_days:+$('cfgClueDays').value,max_clues:+$('cfgMaxClues').value,
    whitelist_user_ids:$('cfgWhitelistUsers').value,whitelist_group_ids:$('cfgWhitelistGroups').value,
    image_candidate_count:+$('cfgImageCount').value,image_send_original:$('cfgImageOriginal').checked,
    image_style_prompt:$('cfgImageStyle').value.trim(),image_selection_provider_id:$('cfgSelectionProvider').value,
    image_generation_mode:$('cfgGenerationMode').value,image_generation_provider_id:$('cfgGenerationProvider').value,
    image_api_base_url:$('cfgImageApiUrl').value.trim(),image_api_model:$('cfgImageApiModel').value.trim(),
    image_api_key:$('cfgImageApiKey').value.trim(),
  };
  try{await bridge.apiPost('config',body);await loadConfig();await status();switchTab(false)}
  catch(err){alert('保存失败：'+(err?.message||err))}
};

await Promise.all([loadCalendar(),loadPlan(),status()]);
</script>
</body></html>
